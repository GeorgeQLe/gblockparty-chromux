name: Windows x64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - run: npm ci
      - run: npm run test:ci:windows
      - run: npm run make:win
      - name: Inspect package
        shell: pwsh
        run: |
          $exe = Get-ChildItem out -Recurse -Filter 'GBlockParty Chromux.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Packaged executable missing' }
          $asar = Join-Path $exe.Directory.FullName 'resources\app.asar'
          if (-not (Test-Path $asar)) { throw 'ASAR missing' }
          $pty = Get-ChildItem $exe.Directory.FullName -Recurse -Filter 'conpty.node' | Select-Object -First 1
          if (-not $pty) { throw 'Unpacked node-pty native module missing' }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($version -ne '0.69.2') { throw "Unexpected version $version" }
      - name: Packaged boot smoke
        shell: pwsh
        run: |
          $exe = Get-ChildItem out -Recurse -Filter 'GBlockParty Chromux.exe' | Select-Object -First 1
          $process = Start-Process $exe.FullName -ArgumentList '--smoke' -PassThru
          if (-not $process.WaitForExit(30000)) { Stop-Process $process.Id -Force; throw 'Packaged smoke timed out' }
      - uses: actions/upload-artifact@v4
        with:
          name: GBlockParty-Chromux-0.69.2-windows-x64
          path: |
            prototype/out/make/squirrel.windows/x64/GBlockParty-Chromux-Setup-0.69.2-x64.exe
            prototype/out/make/squirrel.windows/x64/GBlockPartyChromux-0.69.2-full.nupkg
            prototype/out/make/squirrel.windows/x64/RELEASES
